# FormMaker — nginx static deployment (non-prerendered SPA)
#
# Optional alternative to the built-in Node server. nginx serves the static
# Angular build directly (fast, no Node process for file serving) and reverse
# proxies the JSON API to the Node backend on :3000.
#
# Usage:
#   1. npm run build
#   2. Copy dist/form-maker/browser to /srv/form-maker
#   3. Start the API only:   node --run start:api   (tsx server/index.ts)
#   4. Point this server block at /srv/form-maker and reload nginx.
#
# Prerendered variant: see form-maker.prerendered.conf.

server {
    listen 80;
    server_name formmaker.example.com;

    root /srv/form-maker;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Immutable assets (Angular emits content-hashed filenames) ---
    location ~* \.(js|css|woff|woff2|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- JSON API -> Node backend ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;   # file uploads / signatures (data URLs)
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}