version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'ng-packagr'
      vitest:
        patterns:
          - '@vitest/*'
          - 'vitest'
      # Angular and Vitest packages must move in lockstep (exact peer versions),
      # so keep them out of the type-based groups below.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'ng-packagr'
          - '@vitest/*'
          - 'vitest'
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'ng-packagr'
          - '@vitest/*'
          - 'vitest'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
