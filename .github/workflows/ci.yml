name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Angular build cache
        uses: actions/cache@v5
        with:
          path: .angular/cache
          key: angular-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Generate bundled icon manifest (src/frontend/app/core/icon-names.ts is gitignored)
        run: npm run icons:copy

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (app + spec)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Unit tests with coverage
        run: npm run test:ci -- --coverage

      - name: Server tests
        run: npm run test:server

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate bundled icon manifest (src/frontend/app/core/icon-names.ts is gitignored)
        run: npm run icons:copy

      - name: Cache Angular build cache
        uses: actions/cache@v5
        with:
          path: .angular/cache
          key: angular-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run e2e tests (chromium/firefox/webkit; V8 coverage via chromium)
        run: npm run e2e

      - name: Upload e2e coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: |
            coverage/e2e/lcov.info
            coverage/e2e/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  coverage-merge:
    needs: [verify, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download unit + e2e coverage
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload merged coverage bundle
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: artifacts/
          merge-multiple: true
