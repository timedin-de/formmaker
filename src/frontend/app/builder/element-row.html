@if (el(); as el) {
  <div class="row" [class.selected]="selected()" [class.muted]="el.type === 'section'">
    <div class="row-head">
      <span class="drag-handle" cdkDragHandle aria-hidden="true" [matTooltip]="i18n.t('row.drag')">
        <mat-icon svgIcon="drag_indicator"></mat-icon>
      </span>
      <button
        type="button"
        class="btn-reset row-select"
        [attr.aria-pressed]="selected()"
        [attr.aria-haspopup]="modal.narrow() ? 'dialog' : null"
        (click)="select()"
      >
        <mat-icon class="icon" [svgIcon]="meta().icon"></mat-icon>
        <span class="body">
          <span class="name">{{ el.label }}</span>
          <span class="sub">
            <span class="type-badge">{{ i18n.t(`field.${el.type}`) }}</span>
            @if (has(el, 'required') && el.required) {
              <span class="required-badge">{{ i18n.t('row.required') }}</span>
            }
            @if (elEnabledWhen()) {
              <span class="logic-badge">{{ i18n.t('row.conditional') }}</span>
            }
            @if (has(el, 'defaultValue') && el.defaultValue) {
              <span class="logic-badge">{{ i18n.t('row.default') }}</span>
            }
          </span>
        </span>
      </button>
      <div class="ops">
        @if (neighbours()?.before) {
          <button
            mat-icon-button
            (click)="move(-1, $event)"
            [matTooltip]="
              i18n.t(neighbours()?.before?.type === 'group' ? 'row.moveInGroup' : 'row.moveUp')
            "
            [attr.aria-label]="
              i18n.t(neighbours()?.before?.type === 'group' ? 'row.moveInGroup' : 'row.moveUp')
            "
          >
            <mat-icon svgIcon="arrow_upward"></mat-icon>
          </button>
        }
        @if (neighbours()?.after) {
          <button
            mat-icon-button
            (click)="move(1, $event)"
            [matTooltip]="
              i18n.t(neighbours()?.after?.type === 'group' ? 'row.moveInGroup' : 'row.moveDown')
            "
            [attr.aria-label]="
              i18n.t(neighbours()?.after?.type === 'group' ? 'row.moveInGroup' : 'row.moveDown')
            "
          >
            <mat-icon svgIcon="arrow_downward"></mat-icon>
          </button>
        }
        <button
          mat-icon-button
          (click)="duplicate()"
          [matTooltip]="i18n.t('row.duplicate')"
          [attr.aria-label]="i18n.t('row.duplicate')"
        >
          <mat-icon svgIcon="content_copy"></mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="remove()"
          [matTooltip]="i18n.t('row.delete')"
          [attr.aria-label]="i18n.t('row.delete')"
        >
          <mat-icon svgIcon="delete_outline"></mat-icon>
        </button>
      </div>
    </div>
    @if (el.type === 'group') {
      <!-- Sort and enter predicates: see drop-sort.ts. -->
      <div
        class="group-children"
        [cdkDropListSortPredicate]="canSortAt"
        [cdkDropListEnterPredicate]="canEnter"
        (cdkDropListDropped)="dropElement.emit($event)"
        [cdkDropListData]="el.elements"
        [cdkDropListConnectedTo]="dropLists()"
        cdkDropList
        [id]="`dropList_${el.id}`"
      >
        @for (child of el.elements; track child.id) {
          <div class="group-drag-container" cdkDrag [cdkDragData]="child.id">
            <fm-element-row
              [el]="child"
              [neighbours]="{
                before: el.elements[$index - 1],
                after: el.elements[$index + 1],
              }"
              (paletteTarget)="paletteTarget.emit($event)"
              [dropLists]="dropLists()"
              (dropElement)="dropElement.emit($event)"
              [store]="store()"
            />
          </div>
        }
      </div>
      <button class="add-child" (click)="paletteTarget.emit((e) => addChild(e))">
        <mat-icon svgIcon="add"></mat-icon> {{ i18n.t('row.addChild') }}
      </button>
    }
  </div>
}
