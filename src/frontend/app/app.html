<div class="shell">
  <header>
    <mat-toolbar class="shell-toolbar">
      <a class="brand" routerLink="/">FormMaker</a>
      @if (auth.authenticated()) {
        <nav>
          <a
            mat-button
            routerLink="/"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ i18n.t('app.forms') }}
          </a>
          <a
            mat-button
            routerLink="/builder"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            {{ i18n.t('app.builder') }}
          </a>
          <a
            mat-button
            routerLink="/account"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            {{ i18n.t('app.account') }}
          </a>
        </nav>
      }
      <div class="buttons">
        @if (auth.authenticated()) {
          <button class="top-button" mat-button [matMenuTriggerFor]="langMenu">
            <mat-icon svgIcon="language"></mat-icon>
            <span class="btn-label">{{ i18n.t('app.menu') }}</span>
          </button>
          <button class="top-button" mat-button (click)="logout()">
            <mat-icon svgIcon="logout"></mat-icon>
            <span class="btn-label">{{ i18n.t('app.logout') }}</span>
          </button>
        }
      </div>
    </mat-toolbar>
  </header>
  <main class="shell-content">
    <router-outlet />
  </main>
</div>

<mat-menu #langMenu="matMenu">
  @for (lang of i18n.supported; track lang.code) {
    <button mat-menu-item (click)="i18n.setLang(lang.code)">
      <mat-icon [svgIcon]="i18n.lang() === lang.code ? 'check' : ''"></mat-icon>
      <span>{{ lang.label }}</span>
    </button>
  }
</mat-menu>
