<div class="shell">
  <mat-toolbar class="shell-toolbar">
    <span class="brand" routerLink="/">FormMaker</span>
    @if (auth.authenticated()) {
      <nav>
        <a
          mat-button
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ i18n.t('app.forms') }}
        </a>
        <a mat-button routerLink="/builder" routerLinkActive="active">
          {{ i18n.t('app.builder') }}
        </a>
      </nav>
    }
    @if (repo.offline()) {
      <span class="offline-chip">
        <mat-icon svgIcon="cloud_off" style="font-size: 13px; width: 13px; height: 13px"></mat-icon>
        {{ i18n.t('app.offline') }}
      </span>
    }
    <div class="buttons">
      @if (auth.authenticated()) {
        <button class="top-button" mat-button [matMenuTriggerFor]="langMenu">
          <mat-icon svgIcon="language"></mat-icon>
          <span class="top-button-label">{{ i18n.lang() === 'de' ? 'DE' : 'EN' }}</span>
        </button>
        <button class="top-button" mat-button (click)="logout()">
          <mat-icon svgIcon="logout"></mat-icon>
          <span class="top-button-label">{{ i18n.t('app.logout') }}</span>
        </button>
      }
    </div>
  </mat-toolbar>
  <main class="shell-content">
    <router-outlet />
  </main>
</div>

<mat-menu #langMenu="matMenu">
  @for (lang of i18n.supported; track lang.code) {
    <button mat-menu-item (click)="i18n.setLang(lang.code)">
      <mat-icon [svgIcon]="i18n.lang() === lang.code ? 'check' : ''"></mat-icon>
      <span>{{ lang.label }}</span>
    </button>
  }
</mat-menu>
