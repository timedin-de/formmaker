<div class="main">
  <mat-toolbar color="surface" class="sub">
    <div class="title-group">
      <mat-form-field appearance="outline" class="title-field" subscriptSizing="dynamic">
        <input
          matInput
          [ngModel]="store.form().name"
          (ngModelChange)="store.rename($event)"
          [placeholder]="i18n.t('builder.formName')"
          [attr.aria-label]="i18n.t('builder.formName')"
        />
      </mat-form-field>
      <span class="muted">{{ i18n.t('builder.pages', { n: store.form().pages.length }) }}</span>
    </div>
    <div class="actions">
      <mat-button-toggle-group
        class="mode-toggle"
        [value]="mode()"
        (valueChange)="setMode($event)"
        [attr.aria-label]="i18n.t('builder.splitTooltip')"
      >
        <mat-button-toggle value="split" [matTooltip]="i18n.t('builder.splitTooltip')">
          <mat-icon svgIcon="view_column"></mat-icon>
        </mat-button-toggle>
        <mat-button-toggle value="wysiwyg" [matTooltip]="i18n.t('builder.wysiwygTooltip')">
          <mat-icon svgIcon="view_agenda"></mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>

      <span class="divider"></span>

      <button mat-button (click)="importInput.click()">
        <mat-icon svgIcon="upload_file"></mat-icon> {{ i18n.t('builder.import') }}
      </button>
      <input
        #importInput
        type="file"
        accept=".json,application/json"
        hidden
        (change)="onImport($event)"
      />
      <button mat-button (click)="export()">
        <mat-icon svgIcon="download"></mat-icon> {{ i18n.t('builder.export') }}
      </button>
      <button mat-button (click)="save()" [disabled]="saved()">
        <mat-icon [svgIcon]="saved() ? 'check' : 'save'"></mat-icon>
        {{ saved() ? i18n.t('builder.saved') : i18n.t('builder.save') }}
      </button>
      <button mat-flat-button color="primary" (click)="preview()">
        <mat-icon svgIcon="play_arrow"></mat-icon> {{ i18n.t('builder.preview') }}
      </button>
    </div>
  </mat-toolbar>

  @if (mode() === 'split') {
    <div class="layout">
      <fm-builder-palette class="palette" [store]="store" />
      <fm-builder-canvas class="canvas" [store]="store" />
      <fm-property-panel class="panel" [store]="store" />
    </div>
  } @else {
    <div class="layout-stack">
      <fm-builder-palette [store]="store" [horizontal]="true" />
      <fm-builder-canvas [store]="store" [preview]="true" />
    </div>
  }
</div>
