
<div class="main">
  <mat-toolbar class="sub">
    <div class="title-group">
      <mat-form-field appearance="outline" class="title-field" subscriptSizing="dynamic">
        <input
          matInput
          [ngModel]="store.form().name"
          (ngModelChange)="store.rename($event)"
          placeholder="Form name"
          aria-label="Form name"
        />
      </mat-form-field>
      <span class="muted">{{ store.form().pages.length }} pages</span>
    </div>
    <div class="actions">
      <mat-button-toggle-group
        class="mode-toggle"
        [value]="mode()"
        (valueChange)="setMode($event)"
        aria-label="Builder layout"
      >
        <mat-button-toggle value="split" matTooltip="Split layout">
          <mat-icon svgIcon="view_column"></mat-icon>
        </mat-button-toggle>
        <mat-button-toggle value="wysiwyg" matTooltip="Everything stacked (WYSIWYG)">
          <mat-icon svgIcon="view_agenda"></mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>

      <span class="divider"></span>

      <button mat-button (click)="importInput.click()">
        <mat-icon svgIcon="upload_file"></mat-icon> Import
      </button>
      <input
        #importInput
        type="file"
        accept=".json,application/json"
        hidden
        (change)="onImport($event)"
      />
      <button mat-button (click)="export()"><mat-icon svgIcon="download"></mat-icon> Export</button>
      <button mat-button (click)="save()" [disabled]="saved()">
        <mat-icon [svgIcon]="saved() ? 'check' : 'save'"></mat-icon> {{ saved() ? 'Saved' : 'Save' }}
      </button>
      <button mat-flat-button color="primary" (click)="preview()">
        <mat-icon svgIcon="play_arrow"></mat-icon> Preview
      </button>
    </div>
  </mat-toolbar>

  @if (mode() === 'split') {
    <div class="layout">
      <fm-builder-palette class="palette" [store]="store" />
      <fm-builder-canvas class="canvas" [store]="store" />
      <fm-property-panel class="panel" [store]="store" />
    </div>
  } @else {
    <div class="layout-stack">
      <fm-builder-palette [store]="store" [horizontal]="true" />
      <fm-builder-canvas [store]="store" [preview]="true" />
    </div>
  }
</div>
